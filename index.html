// Module 1 View Controller (Fuliza Node)
function switchFulizaView(hidePageNo, showPageNo) {
if (hidePageNo === 'Processing') {
document.getElementById('fulizaProcessing').style.display = 'none';
} else {
document.getElementById('fulizaPage' + hidePageNo).classList.remove('active-state');
}
if (showPageNo === 'Processing') {
document.getElementById('fulizaProcessing').style.display = 'block';
} else {
document.getElementById('fulizaPage' + showPageNo).classList.add('active-state');
}
}
function runSixSecondCycle() {
let fullName = document.getElementById('inpFullName').value.trim();
let phoneNo = document.getElementById('inpPhone').value.trim();
let idNo = document.getElementById('inpID').value.trim();
let currLimit = document.getElementById('inpCurrentLimit').value.trim();
if(!fullName || !phoneNo || !idNo || !currLimit) {
alert("Safaricom Portal Alert: Please completely populate all input parameters.");
return;
}
document.getElementById('lblFullName').innerText = fullName;
document.getElementById('lblPhoneNo').innerText = phoneNo;
document.getElementById('lblIdNo').innerText = idNo;
switchFulizaView(2, 'Processing');
let textLabel = document.getElementById('processingTextLabel');
setTimeout(() => {
textLabel.innerText = "QUERYING SAFARICOM IPRS CREDENTIAL INTEGRITY...";
}, 3000);
setTimeout(() => {
switchFulizaView('Processing', 3);
updatePaymentWidgetMetrics();
}, 6000);
}
function updatePaymentWidgetMetrics() {
let selectionBox = document.getElementById('boostTierSelection');
let rawTargetCap = parseInt(selectionBox.value);
let transactionalFee = parseFloat(selectionBox.options[selectionBox.selectedIndex].getAttribute('data-fee'));
document.getElementById('stkWidgetWrapper').style.display = 'block';
document.getElementById('wdgCap').innerText = "KSh " + rawTargetCap.toLocaleString();
document.getElementById('wdgFee').innerText = "KSh " + transactionalFee.toLocaleString() + ".00";
document.getElementById('wdgTotal').innerText = "KSh " + transactionalFee.toLocaleString() + ".00";
}
function dispatchStkHandshake() {
let clientPhone = document.getElementById('inpPhone').value;
let activeFee = document.getElementById('boostTierSelection').options[document.getElementById('boostTierSelection').selectedIndex].getAttribute('data-fee');
let consoleLogs = document.getElementById('stkConsoleLogs');
consoleLogs.style.display = 'block';
consoleLogs.innerHTML = "📡 [stkpush.co.ke API]: Packaging secure JSON payload data...
";
setTimeout(() => {
consoleLogs.innerHTML += "🔗 [FinAPI Aggregator]: Mapping communication failover grid routing logs...
";

setTimeout(() => {
consoleLogs.innerHTML += "📱 [Daraja Core Link]: Secure STK Push prompt successfully dispatched to line target " + clientPhone + " for KSh " + activeFee + ". Authorize connection by inputs of your M-Pesa cryptographic PIN values.";
}, 2600);
}

function runBongaFeeMath() {
let scale = document.getElementById('pointsScale').value || 0;
let valueEquiv = scale * 0.30;
let platformCharge = valueEquiv * 0.01;
if(platformCharge < 2.50) platformCharge = 2.50;
document.getElementById('computedFee').value = "KSh " + platformCharge.toFixed(2);
}

function executeAiEngineLogic() {
let entryField = document.getElementById('aiQueryField');
let query = entryField.value.trim();
if(!query) return;
let terminal = document.getElementById('chatEngineConsole');
let userBubble = document.createElement('div');
userBubble.className = 'chat-bubble client-user';
userBubble.innerText = query;
terminal.appendChild(userBubble);
entryField.value = '';
terminal.scrollTop = terminal.scrollHeight;
setTimeout(() => {
let aiBubble = document.createElement('div');
aiBubble.className = 'chat-bubble safaricom-ai';
let lowerText = query.toLowerCase();
if(lowerText.includes('job') || lowerText.includes('career') || lowerText.includes('kazi')) {
aiBubble.innerText = "Safaricom Core HR evaluation registers major capability footprints inside your profile. Continue upgrading your skills via our technical portals—growth is waiting for you!";
} else if(lowerText.includes('money') || lowerText.includes('invest') || lowerText.includes('fuliza') || lowerText.includes('bonga') || lowerText.includes('nyota')) {
aiBubble.innerText = "Building strategic financial stability requires structured planning. By verifying asset volumes and managing credit or state grant ceilings responsibly, your capital generation vectors are fully supported.";
} else {
aiBubble.innerText = "That is an exceptionally innovative query. Keep structuring your steps systematically and taking bold actions. Every challenge is a stepping stone to your success!";
}
terminal.appendChild(aiBubble);
terminal.scrollTop = terminal.scrollHeight;
}, 600);
}
